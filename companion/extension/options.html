<!doctype html>
<html><head><meta charset="utf-8"><title>Diligent companion</title>
<style>
  body { background: #000; color: #fff; font: 13px/1.5 ui-monospace, Menlo, monospace; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  label { display: block; color: #7a7a7a; font-size: 11px; letter-spacing: .1em; margin: 14px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; background: #141414; color: #fff; border: 1px solid #2a2a2a; border-radius: 8px; padding: 9px; font: inherit; }
  textarea { height: 160px; }
  button { margin-top: 14px; background: #fff; color: #000; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 700; }
  p { color: #7a7a7a; }
</style></head>
<body>
  <h2>Diligent companion</h2>
  <p>Same values as Hub → Cloud in the app. Nothing is sent anywhere else.</p>
  <label>SUPABASE PROJECT URL</label><input id="url" placeholder="https://xxxx.supabase.co">
  <label>ANON KEY</label><input id="key">
  <label>OWNER ID</label><input id="owner">
  <label>SITES → ACTIVITIES (one per line, activity names as in the app)</label>
  <textarea id="map">github.com = Coding
leetcode.com = LeetCode
arxiv.org = Research Papers
quantum-computing.ibm.com = Quantum Computing</textarea>
  <button id="save">SAVE</button> <span id="status"></span>
  <script src="options.js"></script>
</body></html>
