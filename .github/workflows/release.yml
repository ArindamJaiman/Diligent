name: Release APK

# Every commit on main becomes a signed release that the app offers as an update
# (Settings → App updates, or the prompt when the app opens). See docs/UPDATES.md.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Releases are published in commit order, never two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code counts commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew # committed from Windows without the executable bit

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # An unsigned APK can't update the installed app, so stop instead of publishing one.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD (docs/UPDATES.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks

      - name: Version
        id: version
        run: |
          CODE=$(git rev-list --count HEAD)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$CODE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PciVersionCode=${{ steps.version.outputs.code }}
          -PciVersionName=${{ steps.version.outputs.name }}

      - name: Package update
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="Diligent-${NAME}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$APK"
          # The Wear OS tile app (wear module), installed on the watch separately
          WEAR=$(ls wear/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$WEAR" ]; then mv "$WEAR" "Diligent-wear-${NAME}.apk"; fi
          jq -n \
            --argjson versionCode "$CODE" \
            --arg versionName "$NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c%s "$APK")" \
            --arg notes "$(git log -1 --format=%s)" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode: $versionCode, versionName: $versionName, commit: $commit, apkUrl: $apkUrl,
              sha256: $sha256, sizeBytes: $sizeBytes, notes: $notes, publishedAt: $publishedAt}' > update.json
          cat update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Diligent ${{ steps.version.outputs.name }}
          generate_release_notes: true
          # The app reads releases/latest/download/update.json, so the newest build is "latest".
          make_latest: true
          files: |
            Diligent-*.apk
            update.json
