name: Build check

# Compiles and tests every push to a branch other than main, without signing or
# publishing anything (main builds releases in release.yml).
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests & debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      - name: Release build (R8)
        run: ./gradlew assembleRelease --stacktrace

      # Room exports a new schema JSON when the database version goes up; print any that
      # aren't committed yet so they can be checked in alongside the migration.
      - name: New Room schemas
        if: always()
        run: |
          git status --porcelain app/schemas
          for f in $(git status --porcelain app/schemas | awk '{print $2}'); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

      - name: Test reports
        if: failure()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -l "<failure" "$f" >/dev/null 2>&1 && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }
          done
          true
